services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medrese
      POSTGRES_PASSWORD: medrese
      POSTGRES_DB: medrese
    ports:
      - "5432:5432"
    volumes:
      - medrese_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medrese"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medrese_db_data:
