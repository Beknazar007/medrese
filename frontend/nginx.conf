server {
    listen 80;
    root /usr/share/nginx/html;

    # React Router: unknown paths load the app, which then shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build files never change — cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker and its manifest must be re-checked on every visit,
    # otherwise phones keep an old version of the app.
    location ~* (sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
    }
}
