name: Deploy

# A release tag vX.Y.Z (set by a person after the release agent's "Release vX.Y.Z" commit)
# re-runs all checks for that commit and publishes the frontend to Cloudflare Pages.
# The job uses the GitHub environment "production": add yourself as a required reviewer
# there (Settings → Environments) to get one more manual "Approve" before every deploy.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  frontend:
    name: deploy frontend (Cloudflare Pages)
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://medrese.pages.dev
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main — release only merged code"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://medrese-backend.onrender.com/api/v1
      - run: npx --yes wrangler@4 pages deploy dist --project-name=medrese --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
